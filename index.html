<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/estilo.css">
    <title>Future Motors</title>
</head>

<body>

<header>
    <img class="logo" src="src/assets/futurelogo.canva.png" alt="Logo Future Motors">
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </nav>
</header>

<main>

    <div class="boas-vindas">
        <h2>
            Bem-vindo à
            <span id="titulo">Future Motors</span>
            aqui você compara dois veículos elétricos e descobre qual tem o melhor desempenho.
        </h2>
    </div>

    <article class="card" id="carro-1">

        <div class="titulo">
            CARRO 1
        </div>

        <div class="linha">
            <span>KMH</span>
            <input type="number" id="kmh-1" name="kmh-1" placeholder="Digite a velocidade">
        </div>

        <div class="linha">
            <span>CONSUMO</span>
            <input type="number" id="consumo-1" name="consumo-1" step="0.1" placeholder="Digite o consumo">
        </div>

        <svg class="detalhes-carro" viewBox="0 0 300 140">
            <circle class="farol" cx="65" cy="30" r="12"></circle>
            <circle class="farol" cx="235" cy="30" r="12"></circle>
            <circle class="roda" cx="65" cy="110" r="28"></circle>
            <circle class="roda" cx="235" cy="110" r="28"></circle>
        </svg>

    </article>

    <article class="card" id="carro-2">

        <div class="titulo">
            CARRO 2
        </div>

        <div class="linha">
            <span>KMH</span>
            <input type="number" id="kmh-2" name="kmh-2" placeholder="Digite a velocidade">
        </div>

        <div class="linha">
            <span>CONSUMO</span>
            <input type="number" id="consumo-2" name="consumo-2" step="0.1" placeholder="Digite o consumo">
        </div>

        <svg class="detalhes-carro" viewBox="0 0 300 140">
            <circle class="farol" cx="65" cy="30" r="12"></circle>
            <circle class="farol" cx="235" cy="30" r="12"></circle>
            <circle class="roda" cx="65" cy="110" r="28"></circle>
            <circle class="roda" cx="235" cy="110" r="28"></circle>
        </svg>

    </article>

</main>

<footer>
    <p>Todos os direitos reservados &copy; 2026</p>
</footer>

<script src="./src/js/script.js"></script>

</body>
</html>
